<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 路線</title>
    <!-- 使用在沙盒 iframe 中相容性極佳的 MapLibre GL JS v2.4.0 -->
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Turf.js (用於地理空間計算，如距離、方向、內插點) -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <!-- Tailwind CSS (用於快速排版) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* 隱藏 MapLibre 預設的 UI 元件以獲得更沉浸的體驗 */
        .maplibregl-ctrl-top-right,
        .maplibregl-ctrl-bottom-right {
            display: none !important;
        }
    </style>
</head>

<body class="text-white font-sans">

    <!-- 地圖容器 -->
    <div id="map"></div>

    <!-- 儀表板與控制列 (直接顯示) -->
    <div id="ui-overlay" class="absolute inset-0 z-40 pointer-events-none flex flex-col justify-between p-6">
        <!-- 頂部：數據儀表板 -->
        <div class="flex justify-between items-start gap-4">
            <div
                class="bg-black/60 backdrop-blur-md rounded-xl p-4 border border-white/10 pointer-events-auto shadow-lg">
                <h1 id="route-title" class="text-xl font-bold mb-1 tracking-wider text-blue-400">玉山主峰單攻</h1>
                <p id="route-description" class="text-sm text-gray-300 mb-4">東埔山莊 ↔ 玉山主峰</p>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <p class="text-xs text-gray-400 uppercase tracking-widest">距離</p>
                        <p class="text-2xl font-mono font-bold"><span id="distance-display">0.0</span> <span
                                class="text-sm font-sans">km</span></p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase tracking-widest">模擬海拔</p>
                        <p class="text-2xl font-mono font-bold"><span id="elevation-display">2580</span> <span
                                class="text-sm font-sans">m</span></p>
                    </div>
                </div>
            </div>
            <div
                class="bg-black/60 backdrop-blur-md rounded-xl p-4 border border-white/10 pointer-events-auto shadow-lg min-w-[220px]">
                <button id="upload-btn"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-emerald-900/70 disabled:cursor-not-allowed text-white rounded-lg px-4 py-2 text-sm font-semibold transition">
                    上傳 GPX
                </button>
                <input id="gpx-upload-input" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml"
                    class="hidden">
                <p id="upload-status" class="text-xs text-gray-300 mt-3 leading-relaxed break-all">目前使用內建 GPX</p>
            </div>
        </div>

        <!-- 底部：播放控制 -->
        <div class="flex justify-center pb-8">
            <div
                class="bg-black/60 backdrop-blur-md rounded-full p-2 pointer-events-auto flex gap-4 border border-white/10">
                <button id="play-btn"
                    class="bg-blue-600 hover:bg-blue-500 text-white rounded-full p-4 transition-transform hover:scale-105">
                    <!-- Play Icon -->
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
                <button id="pause-btn"
                    class="bg-gray-700 hover:bg-gray-600 text-white rounded-full p-4 hidden transition-transform hover:scale-105">
                    <!-- Pause Icon -->
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z"
                            clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 路線資料（由 GPX 載入後填入）
        let yushanWaypoints = [];
        let fullRouteCoords = [];
        let routeLine;
        let totalDistance = 0;
        let routeDistanceProfile = [];

        let map;
        let animationId;
        let currentDistance = 0;
        const animationDuration = 40000; // 動畫總時長 (毫秒)
        let isPlaying = false;
        let lastTime = 0;
        let routeReady = false;
        let mapReady = false;
        let pointSourceReady = false;
        let terrainReady = false;
        let terrainFallbackActive = false;
        let terrainSourceLoaded = false;
        let terrainIdleStable = false;
        let terrainReadyTimeoutId;
        let terrainSourceDataListener;
        let terrainIdleListener;
        let pendingUploadAutoPlayFileName = '';
        const TERRAIN_READY_TIMEOUT_MS = 5000;

        const distanceDisplay = document.getElementById('distance-display');
        const elevationDisplay = document.getElementById('elevation-display');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const routeTitleEl = document.getElementById('route-title');
        const defaultRouteTitleText = routeTitleEl?.textContent?.trim() || '玉山主峰單攻';
        const routeDescriptionEl = document.getElementById('route-description');
        const defaultRouteDescriptionText = routeDescriptionEl?.textContent?.trim() || '東埔山莊 ↔ 玉山主峰';
        const uploadBtn = document.getElementById('upload-btn');
        const gpxUploadInput = document.getElementById('gpx-upload-input');
        const uploadStatusEl = document.getElementById('upload-status');

        function hasPointSource() {
            return Boolean(map && map.getSource && map.getSource('point'));
        }

        function clearTerrainReadyTimeout() {
            if (terrainReadyTimeoutId) {
                clearTimeout(terrainReadyTimeoutId);
                terrainReadyTimeoutId = undefined;
            }
        }

        function safelyIsTerrainSourceLoaded() {
            if (!map || !mapReady || typeof map.isSourceLoaded !== 'function') return false;

            try {
                return Boolean(map.isSourceLoaded('terrain-source'));
            } catch (err) {
                console.warn('[TERRAIN_SOURCE_CHECK_FAIL] 無法確認 terrain-source 載入狀態', err);
                return false;
            }
        }

        function tryStartPendingUploadAutoPlay(reason = 'unknown') {
            if (!pendingUploadAutoPlayFileName) return false;

            pointSourceReady = hasPointSource();
            const canPlay = updatePlayAvailability();
            if (!canPlay) {
                console.info('[AUTO_PLAY_WAIT]', reason, {
                    routeReady,
                    mapReady,
                    pointSourceReady,
                    terrainReady,
                    terrainFallbackActive
                });
                return false;
            }

            const uploadFileName = pendingUploadAutoPlayFileName;
            const started = startPlayback('upload');
            if (started) {
                pendingUploadAutoPlayFileName = '';
                setUploadStatus(`載入成功：${uploadFileName}，已自動播放`, 'success');
                return true;
            }

            return false;
        }

        function detachTerrainReadinessListeners() {
            if (!map) return;

            if (terrainSourceDataListener) {
                map.off('sourcedata', terrainSourceDataListener);
                terrainSourceDataListener = undefined;
            }

            if (terrainIdleListener) {
                map.off('idle', terrainIdleListener);
                terrainIdleListener = undefined;
            }
        }

        function markTerrainReady(reason = 'unknown') {
            if (terrainReady) return;

            terrainReady = true;
            terrainFallbackActive = false;
            clearTerrainReadyTimeout();
            console.info('[TERRAIN_READY]', reason, {
                terrainSourceLoaded,
                terrainIdleStable
            });
            updatePlayAvailability();
            tryStartPendingUploadAutoPlay(`terrain-ready:${reason}`);
        }

        function activateTerrainFallback(reason = 'timeout') {
            if (terrainReady || terrainFallbackActive) return;

            terrainFallbackActive = true;
            clearTerrainReadyTimeout();
            console.warn('[TERRAIN_FALLBACK] 地形載入逾時，啟用可播放降級模式', {
                reason,
                terrainSourceLoaded,
                terrainIdleStable
            });
            setUploadStatus('地形載入較慢，已啟用可播放降級模式', 'loading');
            updatePlayAvailability();
            tryStartPendingUploadAutoPlay(`terrain-fallback:${reason}`);
        }

        function evaluateTerrainReadiness(reason = 'recheck') {
            if (!map || !mapReady) return;

            const sourceLoaded = safelyIsTerrainSourceLoaded();
            if (sourceLoaded && !terrainSourceLoaded) {
                terrainSourceLoaded = true;
                console.info('[TERRAIN_SOURCE_LOADED]', reason);
            }

            if (terrainSourceLoaded && terrainIdleStable) {
                markTerrainReady(reason);
                return;
            }

            updatePlayAvailability();
        }

        function resetTerrainReadiness(reason = 'reset') {
            clearTerrainReadyTimeout();
            terrainReady = false;
            terrainFallbackActive = false;
            terrainSourceLoaded = false;
            terrainIdleStable = false;
            console.info('[TERRAIN_RESET]', reason);
            updatePlayAvailability();
        }

        function startTerrainReadinessMonitor(reason = 'map-load') {
            if (!map) return;

            detachTerrainReadinessListeners();
            resetTerrainReadiness(reason);

            terrainSourceDataListener = (event) => {
                if (!event || event.sourceId !== 'terrain-source') return;

                if (event.isSourceLoaded) {
                    terrainSourceLoaded = true;
                }
                evaluateTerrainReadiness(`sourcedata:${reason}`);
            };

            terrainIdleListener = () => {
                terrainIdleStable = true;
                evaluateTerrainReadiness(`idle:${reason}`);
            };

            map.on('sourcedata', terrainSourceDataListener);
            map.on('idle', terrainIdleListener);
            evaluateTerrainReadiness(`monitor-start:${reason}`);

            terrainReadyTimeoutId = window.setTimeout(() => {
                activateTerrainFallback(`${reason}:timeout-${TERRAIN_READY_TIMEOUT_MS}ms`);
            }, TERRAIN_READY_TIMEOUT_MS);
        }

        function updatePlayAvailability() {
            const canPlay = routeReady
                && mapReady
                && pointSourceReady
                && (terrainReady || terrainFallbackActive)
                && Boolean(routeLine)
                && Number.isFinite(totalDistance)
                && totalDistance > 0;

            playBtn.disabled = !canPlay;
            playBtn.classList.toggle('opacity-50', !canPlay);
            playBtn.classList.toggle('cursor-not-allowed', !canPlay);
            playBtn.classList.toggle('hover:scale-105', canPlay);
            return canPlay;
        }

        function setUploadStatus(message, state = 'idle') {
            if (!uploadStatusEl) return;

            uploadStatusEl.textContent = message;
            uploadStatusEl.classList.remove('text-gray-300', 'text-blue-300', 'text-green-300', 'text-red-400');

            const stateClass = {
                idle: 'text-gray-300',
                loading: 'text-blue-300',
                success: 'text-green-300',
                error: 'text-red-400'
            }[state] || 'text-gray-300';

            uploadStatusEl.classList.add(stateClass);
        }

        function stopAnimationWithError(reason, diagnostics = {}) {
            console.error('[ANIM_GUARD_FAIL]', reason, diagnostics);
            isPlaying = false;
            toggleButtons();
            cancelAnimationFrame(animationId);
            animationId = undefined;
        }

        function buildRouteDistanceProfile(coords) {
            const profile = [{ distance: 0, elevation: coords[0][2] ?? 0 }];
            let accumulatedDistance = 0;

            for (let i = 1; i < coords.length; i++) {
                const segmentDistance = turf.distance(
                    turf.point(coords[i - 1]),
                    turf.point(coords[i]),
                    { units: 'kilometers' }
                );

                accumulatedDistance += segmentDistance;
                profile.push({
                    distance: accumulatedDistance,
                    elevation: coords[i][2] ?? profile[profile.length - 1].elevation
                });
            }

            return profile;
        }

        function getElevationAtDistance(distanceKm) {
            if (distanceKm <= 0) return routeDistanceProfile[0].elevation;

            const lastPoint = routeDistanceProfile[routeDistanceProfile.length - 1];
            if (distanceKm >= lastPoint.distance) return lastPoint.elevation;

            for (let i = 1; i < routeDistanceProfile.length; i++) {
                const previousPoint = routeDistanceProfile[i - 1];
                const nextPoint = routeDistanceProfile[i];

                if (distanceKm <= nextPoint.distance) {
                    const segmentDistance = nextPoint.distance - previousPoint.distance;
                    if (segmentDistance === 0) return nextPoint.elevation;

                    const ratio = (distanceKm - previousPoint.distance) / segmentDistance;
                    return previousPoint.elevation + (nextPoint.elevation - previousPoint.elevation) * ratio;
                }
            }

            return lastPoint.elevation;
        }

        function formatUtcPlus8(rawTimeText) {
            if (!rawTimeText) return '';

            const parsedTime = new Date(rawTimeText);
            if (Number.isNaN(parsedTime.getTime())) return '';

            const utcPlus8Ms = parsedTime.getTime() + (8 * 60 * 60 * 1000);
            const utcPlus8Date = new Date(utcPlus8Ms);

            const year = utcPlus8Date.getUTCFullYear();
            const month = String(utcPlus8Date.getUTCMonth() + 1).padStart(2, '0');
            const day = String(utcPlus8Date.getUTCDate()).padStart(2, '0');
            const hours = String(utcPlus8Date.getUTCHours()).padStart(2, '0');
            const minutes = String(utcPlus8Date.getUTCMinutes()).padStart(2, '0');
            const seconds = String(utcPlus8Date.getUTCSeconds()).padStart(2, '0');

            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds} +08:00`;
        }

        function parseTrackPointTimeMs(rawTimeText) {
            const normalizedText = typeof rawTimeText === 'string' ? rawTimeText.trim() : '';
            if (!normalizedText) return null;

            const parsedMs = Date.parse(normalizedText);
            return Number.isFinite(parsedMs) ? parsedMs : null;
        }

        function analyzeRoundTrip(points) {
            if (!Array.isArray(points) || points.length < 2) {
                return {
                    alreadyRoundTrip: false,
                    routeLengthKm: 0,
                    startEndDistanceKm: Infinity,
                    closureThresholdKm: 0
                };
            }

            const routeLengthKm = turf.length(turf.lineString(points), { units: 'kilometers' });
            const startEndDistanceKm = turf.distance(
                turf.point(points[0]),
                turf.point(points[points.length - 1]),
                { units: 'kilometers' }
            );

            const gpsDriftFloorKm = 0.06;
            const closureRatio = 0.02;
            const minRouteLengthKm = 0.2;
            const closureThresholdKm = Math.max(gpsDriftFloorKm, routeLengthKm * closureRatio);
            const alreadyRoundTrip = routeLengthKm >= minRouteLengthKm && startEndDistanceKm <= closureThresholdKm;

            return {
                alreadyRoundTrip,
                routeLengthKm,
                startEndDistanceKm,
                closureThresholdKm
            };
        }

        function analyzeTimeQuality(pointTimes) {
            if (!Array.isArray(pointTimes) || pointTimes.length === 0) {
                return {
                    totalPoints: 0,
                    timedPoints: 0,
                    timeCoverageRatio: 0,
                    monotonicPairs: 0,
                    monotonicRatio: 0
                };
            }

            const normalizedTimes = pointTimes.map((timeMs) => (Number.isFinite(timeMs) ? timeMs : null));
            const timedIndexes = [];
            for (let i = 0; i < normalizedTimes.length; i++) {
                if (normalizedTimes[i] !== null) {
                    timedIndexes.push(i);
                }
            }

            let monotonicPairs = 0;
            let comparablePairs = 0;
            for (let i = 1; i < timedIndexes.length; i++) {
                const prevTimeMs = normalizedTimes[timedIndexes[i - 1]];
                const currentTimeMs = normalizedTimes[timedIndexes[i]];
                comparablePairs += 1;
                if (currentTimeMs >= prevTimeMs) {
                    monotonicPairs += 1;
                }
            }

            const monotonicRatio = comparablePairs > 0
                ? monotonicPairs / comparablePairs
                : (timedIndexes.length > 0 ? 1 : 0);

            return {
                totalPoints: normalizedTimes.length,
                timedPoints: timedIndexes.length,
                timeCoverageRatio: timedIndexes.length / normalizedTimes.length,
                monotonicPairs,
                monotonicRatio
            };
        }

        function analyzeTimeOrderedDisplacement(points, pointTimes) {
            const emptyStats = {
                sampleCount: 0,
                maxDistanceKm: 0,
                maxDistanceIndex: -1,
                maxDistanceSourceIndex: -1,
                endDistanceKm: 0,
                endToStartRatio: 1,
                peakProgressRatio: 1
            };

            if (!Array.isArray(points) || points.length < 2 || !Array.isArray(pointTimes) || pointTimes.length < 2) {
                return emptyStats;
            }

            const checkpointCount = Math.min(points.length, pointTimes.length);
            const checkpoints = [];
            for (let i = 0; i < checkpointCount; i++) {
                const point = points[i];
                const timeMs = pointTimes[i];
                if (!Array.isArray(point) || point.length < 2) continue;
                if (!Number.isFinite(point[0]) || !Number.isFinite(point[1])) continue;
                if (!Number.isFinite(timeMs)) continue;

                checkpoints.push({
                    sourceIndex: i,
                    timeMs,
                    point
                });
            }

            if (checkpoints.length < 2) {
                return {
                    ...emptyStats,
                    sampleCount: checkpoints.length
                };
            }

            checkpoints.sort((a, b) => {
                if (a.timeMs !== b.timeMs) return a.timeMs - b.timeMs;
                return a.sourceIndex - b.sourceIndex;
            });

            const startPoint = points[0];
            let maxDistanceKm = -Infinity;
            let maxDistanceIndex = -1;
            let maxDistanceSourceIndex = -1;
            let endDistanceKm = 0;

            for (let i = 0; i < checkpoints.length; i++) {
                const displacementKm = turf.distance(
                    turf.point(startPoint),
                    turf.point(checkpoints[i].point),
                    { units: 'kilometers' }
                );

                if (displacementKm > maxDistanceKm) {
                    maxDistanceKm = displacementKm;
                    maxDistanceIndex = i;
                    maxDistanceSourceIndex = checkpoints[i].sourceIndex;
                }

                if (i === checkpoints.length - 1) {
                    endDistanceKm = displacementKm;
                }
            }

            if (!Number.isFinite(maxDistanceKm) || maxDistanceKm < 0) {
                return {
                    ...emptyStats,
                    sampleCount: checkpoints.length
                };
            }

            return {
                sampleCount: checkpoints.length,
                maxDistanceKm,
                maxDistanceIndex,
                maxDistanceSourceIndex,
                endDistanceKm,
                endToStartRatio: maxDistanceKm > 0 ? endDistanceKm / maxDistanceKm : 0,
                peakProgressRatio: checkpoints.length > 1 ? maxDistanceIndex / (checkpoints.length - 1) : 1
            };
        }

        function decideRouteMode(points, pointTimes) {
            const roundTripStats = analyzeRoundTrip(points);
            const timeQuality = analyzeTimeQuality(pointTimes);
            const displacementStats = analyzeTimeOrderedDisplacement(points, pointTimes);

            const geometryMode = roundTripStats.alreadyRoundTrip
                ? 'already-round-trip'
                : 'needs-mirror-return';

            const minMeaningfulDisplacementKm = Math.max(0.15, roundTripStats.routeLengthKm * 0.12);
            const hasMeaningfulPeak = displacementStats.maxDistanceKm >= minMeaningfulDisplacementKm;
            const returnPhaseLikely = hasMeaningfulPeak
                && displacementStats.peakProgressRatio <= 0.88
                && displacementStats.endToStartRatio <= 0.45;
            const outboundOnlyLikely = hasMeaningfulPeak
                && displacementStats.peakProgressRatio >= 0.93
                && displacementStats.endToStartRatio >= 0.75;

            const strongTimeSignal = timeQuality.timeCoverageRatio >= 0.7
                && timeQuality.monotonicRatio >= 0.95
                && displacementStats.sampleCount >= 6;
            const partialTimeSignal = !strongTimeSignal
                && timeQuality.timeCoverageRatio >= 0.3
                && timeQuality.monotonicRatio >= 0.8
                && displacementStats.sampleCount >= 4;

            const buildDecision = (mode, tier, reason) => ({
                mode,
                tier,
                reason,
                roundTripStats,
                metrics: {
                    timeCoverageRatio: timeQuality.timeCoverageRatio,
                    monotonicRatio: timeQuality.monotonicRatio,
                    timedPoints: timeQuality.timedPoints,
                    totalPoints: timeQuality.totalPoints,
                    timeSamples: displacementStats.sampleCount,
                    maxDistanceIndex: displacementStats.maxDistanceIndex,
                    maxDistanceSourceIndex: displacementStats.maxDistanceSourceIndex,
                    maxDistanceKm: displacementStats.maxDistanceKm,
                    peakProgressRatio: displacementStats.peakProgressRatio,
                    endDistanceKm: displacementStats.endDistanceKm,
                    endToStartRatio: displacementStats.endToStartRatio
                }
            });

            if (strongTimeSignal) {
                if (returnPhaseLikely) {
                    return buildDecision('already-round-trip', 'time-rich', 'time-return-phase-detected');
                }
                if (outboundOnlyLikely) {
                    return buildDecision('needs-mirror-return', 'time-rich', 'time-outbound-detected');
                }
                return buildDecision(geometryMode, 'time-rich', 'time-ambiguous-geometry-check');
            }

            if (partialTimeSignal) {
                if (returnPhaseLikely && !outboundOnlyLikely) {
                    return buildDecision('already-round-trip', 'partial-time', 'partial-time-return-signal');
                }
                if (outboundOnlyLikely && !returnPhaseLikely) {
                    return buildDecision('needs-mirror-return', 'partial-time', 'partial-time-outbound-signal');
                }
                return buildDecision(geometryMode, 'partial-time', 'partial-time-geometry-fallback');
            }

            return buildDecision(geometryMode, 'geometry-fallback', 'insufficient-time-signal');
        }

        async function readGpxTextFromSource(source) {
            if (typeof source === 'string') {
                let response;
                try {
                    response = await fetch(source);
                } catch (err) {
                    throw new Error(`GPX 載入失敗: ${err.message}`);
                }

                if (!response.ok) {
                    throw new Error(`GPX 載入失敗: ${response.status} ${response.statusText}`);
                }

                return response.text();
            }

            const isFileObject = typeof File !== 'undefined' && source instanceof File;
            if (isFileObject) {
                try {
                    return await source.text();
                } catch (err) {
                    throw new Error(`GPX 檔案讀取失敗: ${err.message}`);
                }
            }

            throw new Error('不支援的 GPX 來源');
        }

        function parseGpxRoute(gpxText) {
            const xmlDoc = new DOMParser().parseFromString(gpxText, 'application/xml');
            if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
                throw new Error('GPX XML 解析失敗');
            }

            const trkNode = xmlDoc.getElementsByTagNameNS('*', 'trk')[0];
            const trkNameNode = trkNode ? trkNode.getElementsByTagNameNS('*', 'name')[0] : null;
            const gpxTrackName = trkNameNode?.textContent?.trim() || '';
            const metadataNode = xmlDoc.getElementsByTagNameNS('*', 'metadata')[0];
            const metadataTimeNode = metadataNode ? metadataNode.getElementsByTagNameNS('*', 'time')[0] : null;
            const gpxMetadataTimeRaw = metadataTimeNode?.textContent?.trim() || '';
            const gpxMetadataTime = formatUtcPlus8(gpxMetadataTimeRaw);

            const trkpts = Array.from(xmlDoc.getElementsByTagNameNS('*', 'trkpt'));
            const parsedTrackPoints = trkpts
                .map((pt) => {
                    const lat = Number(pt.getAttribute('lat'));
                    const lon = Number(pt.getAttribute('lon'));
                    const eleNode = pt.getElementsByTagNameNS('*', 'ele')[0];
                    const ele = eleNode ? Number(eleNode.textContent) : 0;
                    const timeNode = pt.getElementsByTagNameNS('*', 'time')[0];
                    const timeMs = parseTrackPointTimeMs(timeNode?.textContent);

                    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
                    return {
                        point: [lon, lat, Number.isFinite(ele) ? ele : 0],
                        timeMs
                    };
                })
                .filter(Boolean);

            const points = parsedTrackPoints.map(({ point }) => point);
            const pointTimes = parsedTrackPoints.map(({ timeMs }) => timeMs);

            if (points.length < 2) {
                throw new Error('GPX trkpt 不足，至少需要 2 個點');
            }

            return {
                points,
                pointTimes,
                gpxTrackName,
                gpxMetadataTime
            };
        }

        function getFileNameWithoutExtension(fileName) {
            const normalizedName = typeof fileName === 'string' ? fileName.trim() : '';
            if (!normalizedName) return '';

            const dotIndex = normalizedName.lastIndexOf('.');
            if (dotIndex <= 0) return normalizedName;
            return normalizedName.slice(0, dotIndex);
        }

        function applyLoadedRoute({ points, pointTimes = [], gpxTrackName, gpxMetadataTime, fallbackRouteTitle = defaultRouteTitleText }) {
            yushanWaypoints = points;

            const routeDecision = decideRouteMode(yushanWaypoints, pointTimes);
            if (routeDecision.mode === 'already-round-trip') {
                fullRouteCoords = [...yushanWaypoints];
            } else {
                fullRouteCoords = [...yushanWaypoints];
                for (let i = yushanWaypoints.length - 2; i >= 0; i--) {
                    fullRouteCoords.push(yushanWaypoints[i]);
                }
            }

            const { metrics, roundTripStats } = routeDecision;
            console.info(
                `[GPX_ROUTE_MODE] mode=${routeDecision.mode} tier=${routeDecision.tier} reason=${routeDecision.reason} coverage=${metrics.timeCoverageRatio.toFixed(2)} monotonic=${metrics.monotonicRatio.toFixed(2)} timed=${metrics.timedPoints}/${metrics.totalPoints} maxIdx=${metrics.maxDistanceIndex} endRatio=${metrics.endToStartRatio.toFixed(2)} geomClosed=${roundTripStats.alreadyRoundTrip} startEndKm=${roundTripStats.startEndDistanceKm.toFixed(3)} routeLengthKm=${roundTripStats.routeLengthKm.toFixed(3)} thresholdKm=${roundTripStats.closureThresholdKm.toFixed(3)}`
            );

            routeLine = turf.lineString(fullRouteCoords);
            totalDistance = turf.length(routeLine, { units: 'kilometers' });
            routeDistanceProfile = buildRouteDistanceProfile(fullRouteCoords);
            if (!Number.isFinite(totalDistance) || totalDistance <= 0 || routeDistanceProfile.length < 2) {
                throw new Error('GPX 路線資料無效，無法建立動畫路徑');
            }

            if (routeTitleEl) {
                routeTitleEl.textContent = gpxTrackName || fallbackRouteTitle || defaultRouteTitleText;
            }
            if (routeDescriptionEl) {
                routeDescriptionEl.textContent = gpxMetadataTime || defaultRouteDescriptionText;
            }
        }

        async function loadRouteFromGpx(source) {
            const gpxText = await readGpxTextFromSource(source);
            const parsedRoute = parseGpxRoute(gpxText);
            const isFileObject = typeof File !== 'undefined' && source instanceof File;
            const fallbackRouteTitle = isFileObject
                ? (getFileNameWithoutExtension(source.name) || defaultRouteTitleText)
                : defaultRouteTitleText;
            applyLoadedRoute({ ...parsedRoute, fallbackRouteTitle });
        }

        function ensureRouteAndPointLayers() {
            if (!map) return;

            const startPoint = turf.point(fullRouteCoords[0]);
            const routeSource = map.getSource('route');
            if (routeSource && routeSource.setData) {
                routeSource.setData(routeLine);
            } else if (!routeSource) {
                map.addSource('route', {
                    type: 'geojson',
                    data: routeLine
                });
            }

            if (!map.getLayer('route-line')) {
                map.addLayer({
                    id: 'route-line',
                    type: 'line',
                    source: 'route',
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': 'rgba(255, 255, 255, 0.5)',
                        'line-width': 4,
                        'line-dasharray': [2, 2]
                    }
                });
            }

            const pointSource = map.getSource('point');
            if (pointSource && pointSource.setData) {
                pointSource.setData(startPoint);
            } else if (!pointSource) {
                map.addSource('point', {
                    type: 'geojson',
                    data: startPoint
                });
            }

            if (!map.getLayer('point-circle')) {
                map.addLayer({
                    id: 'point-circle',
                    type: 'circle',
                    source: 'point',
                    paint: {
                        'circle-radius': 8,
                        'circle-color': '#3b82f6',
                        'circle-stroke-width': 3,
                        'circle-stroke-color': '#ffffff'
                    }
                });
            }
        }

        function moveCameraToRouteStart() {
            if (!map || !mapReady || !Array.isArray(fullRouteCoords) || fullRouteCoords.length < 1) return;

            let initialBearing = map.getBearing();
            if (fullRouteCoords.length >= 2) {
                try {
                    initialBearing = turf.bearing(
                        turf.point(fullRouteCoords[0]),
                        turf.point(fullRouteCoords[1])
                    );
                } catch (err) {
                    console.warn('初始方向計算失敗，使用當前地圖方向:', err.message);
                }
            }

            map.jumpTo({
                center: fullRouteCoords[0],
                zoom: 13.5,
                pitch: 65,
                bearing: Number.isFinite(initialBearing) ? initialBearing : map.getBearing()
            });
        }

        function resetPlaybackState() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            animationId = undefined;
            currentDistance = 0;
            lastTime = 0;
            distanceDisplay.textContent = '0.0';

            const initialElevation = routeDistanceProfile[0]?.elevation;
            if (Number.isFinite(initialElevation)) {
                elevationDisplay.textContent = Math.floor(initialElevation);
            }

            toggleButtons();
        }

        function syncRouteToMap() {
            if (!map || !mapReady) {
                pointSourceReady = hasPointSource();
                updatePlayAvailability();
                return;
            }

            ensureRouteAndPointLayers();
            pointSourceReady = hasPointSource();
            moveCameraToRouteStart();
            evaluateTerrainReadiness('sync-route');
            updatePlayAvailability();
        }

        function startPlayback(trigger = 'manual') {
            pointSourceReady = hasPointSource();
            const canPlay = updatePlayAvailability();
            if (!canPlay) {
                console.error('[PLAY_GUARD_FAIL] 路線或地圖尚未就緒，已阻止播放', {
                    trigger,
                    routeReady,
                    mapReady,
                    pointSourceReady,
                    terrainReady,
                    terrainFallbackActive,
                    hasRouteLine: Boolean(routeLine),
                    totalDistance
                });
                return false;
            }

            if (currentDistance >= totalDistance) {
                currentDistance = 0;
            }
            if (trigger !== 'upload' && pendingUploadAutoPlayFileName) {
                pendingUploadAutoPlayFileName = '';
            }
            isPlaying = true;
            lastTime = 0;
            toggleButtons();
            cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(animateMarker);
            return true;
        }

        function initMap() {
            mapReady = false;
            pointSourceReady = false;
            detachTerrainReadinessListeners();
            resetTerrainReadiness('map-init');

            try {
                map = new maplibregl.Map({
                    container: 'map',
                    attributionControl: false,
                    style: {
                        version: 8,
                        // 關鍵修復：強制提供絕對路徑的 glyphs，避免 MapLibre 讀取 location.href 觸發沙盒錯誤
                        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
                        sources: {
                            'satellite': {
                                type: 'raster',
                                tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                                tileSize: 256
                            },
                            'terrain-source': {
                                type: 'raster-dem',
                                tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
                                encoding: 'terrarium',
                                tileSize: 256,
                                maxzoom: 14
                            }
                        },
                        layers: [{
                            id: 'satellite-layer',
                            type: 'raster',
                            source: 'satellite',
                            minzoom: 0,
                            maxzoom: 22
                        }],
                        terrain: {
                            source: 'terrain-source',
                            exaggeration: 1.5
                        }
                    },
                    center: [yushanWaypoints[0][0], yushanWaypoints[0][1]],
                    zoom: 13,
                    pitch: 60,
                    bearing: 150
                });

                map.on('load', () => {
                    try {
                        mapReady = true;
                        startTerrainReadinessMonitor('map-load');
                        ensureRouteAndPointLayers();
                        resetPlaybackState();
                        pointSourceReady = hasPointSource();
                        moveCameraToRouteStart();
                        updatePlayAvailability();
                        tryStartPendingUploadAutoPlay('map-load');
                    } catch (err) {
                        mapReady = false;
                        pointSourceReady = false;
                        detachTerrainReadinessListeners();
                        resetTerrainReadiness('map-load-failed');
                        console.error('地圖載入流程失敗（控制已停用）:', err, {
                            hasRouteLine: Boolean(routeLine),
                            routeCoordsLength: fullRouteCoords.length
                        });
                    }
                });
            } catch (err) {
                mapReady = false;
                pointSourceReady = false;
                detachTerrainReadinessListeners();
                resetTerrainReadiness('map-init-failed');
                console.error("地圖初始化失敗:", err);
                alert("在目前的沙盒預覽環境中載入地圖失敗，但此程式碼在您真實的伺服器上可以正常運作。");
            }
        }

        function animateMarker(timestamp) {
            if (!isPlaying) return;

            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            const speed = totalDistance / animationDuration;
            currentDistance += speed * deltaTime;

            if (currentDistance >= totalDistance) {
                currentDistance = totalDistance;
                isPlaying = false;
                toggleButtons();
            }

            const lookAheadDistance = Math.min(currentDistance + 0.5, totalDistance);
            const hasRouteLine = Boolean(
                routeLine
                && routeLine.geometry
                && Array.isArray(routeLine.geometry.coordinates)
                && routeLine.geometry.coordinates.length >= 2
            );
            const distancesAreFinite = Number.isFinite(currentDistance)
                && Number.isFinite(totalDistance)
                && Number.isFinite(lookAheadDistance);
            const pointSource = map && map.getSource ? map.getSource('point') : null;
            pointSourceReady = Boolean(pointSource);

            if (!hasRouteLine || !distancesAreFinite || !pointSource) {
                stopAnimationWithError('動畫前置檢查失敗，已中止播放', {
                    hasRouteLine,
                    distancesAreFinite,
                    currentDistance,
                    lookAheadDistance,
                    totalDistance,
                    pointSourceReady,
                    routeReady,
                    mapReady,
                    terrainReady,
                    terrainFallbackActive
                });
                updatePlayAvailability();
                return;
            }

            let currentPoint;
            let currentBearing;
            try {
                currentPoint = turf.along(routeLine, currentDistance, { units: 'kilometers' });
                const lookAheadPoint = turf.along(routeLine, lookAheadDistance, { units: 'kilometers' });
                currentBearing = turf.bearing(currentPoint, lookAheadPoint);
            } catch (err) {
                stopAnimationWithError('Turf 計算失敗，已中止播放', {
                    currentDistance,
                    lookAheadDistance,
                    totalDistance,
                    hasRouteLine,
                    pointSourceReady,
                    error: err.message
                });
                return;
            }

            pointSource.setData(currentPoint);

            const coords = currentPoint.geometry.coordinates;
            distanceDisplay.textContent = currentDistance.toFixed(1);

            const elevation = getElevationAtDistance(currentDistance);
            elevationDisplay.textContent = Math.floor(elevation);

            map.jumpTo({
                center: coords,
                zoom: 13.5,
                pitch: 65,
                bearing: currentBearing
            });

            if (isPlaying) {
                animationId = requestAnimationFrame(animateMarker);
            }
        }

        function toggleButtons() {
            if (isPlaying) {
                playBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
            } else {
                playBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
            }
            pauseBtn.disabled = !isPlaying;
        }

        async function handleGpxUpload(file) {
            if (!file) return;

            setUploadStatus(`載入中：${file.name}`, 'loading');
            if (uploadBtn) {
                uploadBtn.disabled = true;
            }

            try {
                await loadRouteFromGpx(file);
                routeReady = true;
                resetPlaybackState();
                syncRouteToMap();
                if (mapReady) {
                    startTerrainReadinessMonitor('upload-reload');
                }
                pendingUploadAutoPlayFileName = file.name;
                const autoStarted = tryStartPendingUploadAutoPlay('upload-complete');
                if (!autoStarted) {
                    setUploadStatus(`載入成功：${file.name}，等待地形就緒後自動播放`, 'loading');
                }
            } catch (err) {
                pendingUploadAutoPlayFileName = '';
                console.error('上傳 GPX 失敗（狀態已保持穩定）:', err, {
                    routeReady,
                    mapReady,
                    pointSourceReady,
                    terrainReady,
                    terrainFallbackActive
                });
                setUploadStatus(`載入失敗：${err.message}`, 'error');
                updatePlayAvailability();
            } finally {
                if (uploadBtn) {
                    uploadBtn.disabled = false;
                }
                if (gpxUploadInput) {
                    gpxUploadInput.value = '';
                }
            }
        }

        (async function bootstrap() {
            try {
                await loadRouteFromGpx('gpx/Qixingshan.gpx');
                routeReady = true;
                updatePlayAvailability();
                setUploadStatus('已載入內建 GPX，可上傳替換', 'idle');
                initMap();
            } catch (err) {
                routeReady = false;
                mapReady = false;
                pointSourceReady = false;
                pendingUploadAutoPlayFileName = '';
                detachTerrainReadinessListeners();
                resetTerrainReadiness('bootstrap-failed');
                isPlaying = false;
                toggleButtons();
                updatePlayAvailability();
                setUploadStatus(`預設 GPX 載入失敗：${err.message}`, 'error');
                console.error('初始化失敗（控制已停用）:', err, {
                    routeReady,
                    mapReady,
                    pointSourceReady,
                    terrainReady,
                    terrainFallbackActive,
                    hasRouteLine: Boolean(routeLine),
                    routeCoordsLength: fullRouteCoords.length,
                    totalDistance
                });
                alert(`無法載入 GPX：${err.message}`);
            }
        })();

        playBtn.addEventListener('click', () => {
            startPlayback('manual');
        });

        if (uploadBtn && gpxUploadInput) {
            uploadBtn.addEventListener('click', () => {
                gpxUploadInput.click();
            });

            gpxUploadInput.addEventListener('change', async (event) => {
                const selectedFile = event.target?.files?.[0];
                await handleGpxUpload(selectedFile);
            });
        }

        pauseBtn.addEventListener('click', () => {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            animationId = undefined;
            toggleButtons();
        });

        toggleButtons();
        updatePlayAvailability();

    </script>
</body>
