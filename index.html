<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 路線動畫製作工具</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .backdrop-blur-md { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        /* 讓可編輯標題不顯示外框 */
        [contenteditable]:focus { outline: none; }
    </style>
</head>
<body class="text-white font-sans">

    <div id="map"></div>

    <div id="ui-overlay" class="absolute inset-0 z-40 pointer-events-none flex flex-col justify-between p-6">
        <div class="flex flex-col gap-4 items-start pointer-events-auto w-80">
            <div class="bg-black/60 backdrop-blur-md rounded-2xl p-5 border border-white/10 shadow-xl w-full">
                <div class="flex items-center justify-between mb-1 group">
                    <h1 id="route-title" 
                        class="text-xl font-bold tracking-wider text-blue-400 cursor-pointer hover:bg-white/5 px-1 rounded transition-all focus:ring-1 focus:ring-blue-500/50" 
                        contenteditable="true" 
                        spellcheck="false"
                        title="點擊修改軌跡名稱">
                        待上傳軌跡
                    </h1>
                    <svg class="w-4 h-4 text-gray-600 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                    </svg>
                </div>
                
                <p id="route-subtitle" class="text-xs text-gray-400 mb-4">請上傳帶有 GPS 資訊的照片</p>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase font-bold">目前距離</p>
                        <p class="text-2xl font-mono font-bold"><span id="distance-display">0.0</span> <span class="text-sm font-sans text-gray-400">km</span></p>
                    </div>
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase font-bold">當前海拔</p>
                        <p class="text-2xl font-mono font-bold"><span id="elevation-display">---</span> <span class="text-sm font-sans text-gray-400">m</span></p>
                    </div>
                </div>
            </div>

            <div class="bg-black/60 backdrop-blur-md rounded-full p-2 border border-white/10 shadow-xl w-full flex items-center justify-between px-3 pointer-events-auto">
                <label for="photo-upload" class="p-3 hover:bg-white/10 rounded-full transition-all cursor-pointer group" title="新增照片並取代軌跡">
                    <svg class="w-6 h-6 text-blue-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <input type="file" id="photo-upload" multiple accept="image/*" class="hidden">
                </label>

                <button id="share-btn" class="p-3 hover:bg-white/10 rounded-full transition-all group" title="分享畫面 (截圖)">
                    <svg class="w-6 h-6 text-gray-300 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316M18 12a3 3 0 100-6 3 3 0 000 6zM6 18a3 3 0 100-6 3 3 0 000 6z"></path>
                    </svg>
                </button>

                <button id="view-toggle-btn" class="p-3 hover:bg-white/10 rounded-full transition-all group" title="切換 2D/3D">
                    <svg class="w-6 h-6 text-gray-300 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                    </svg>
                </button>

                <button id="speed-btn" class="px-4 py-2 hover:bg-white/10 rounded-full transition-all text-xs font-mono font-bold text-gray-300 hover:text-white">
                    1.0x
                </button>
            </div>
        </div>

        <div class="flex justify-center pb-8 pointer-events-auto">
            <div class="bg-black/60 backdrop-blur-md rounded-full p-2 flex gap-4 border border-white/10 shadow-2xl">
                <button id="play-btn" class="bg-blue-600 hover:bg-blue-500 text-white rounded-full p-4 transition-transform hover:scale-110">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
                    </svg>
                </button>
                <button id="pause-btn" class="bg-gray-700 hover:bg-gray-600 text-white rounded-full p-4 hidden transition-transform hover:scale-110">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let map;
        let routeLine = null;
        let totalDistance = 0;
        let currentDistance = 0;
        let isPlaying = false;
        let animationId = null;
        let lastTime = 0;
        let playbackSpeed = 1;
        let photoFeatures = [];
        let noGpsPhotos = [];
        let activePopup = null;

        function escHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        const distanceDisplay= document.getElementById('distance-display');
        const elevationDisplay = document.getElementById('elevation-display');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const routeTitle = document.getElementById('route-title');

        // 初始化地圖
        initMap();

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                attributionControl: false,
                style: {
                    version: 8,
                    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
                    sources: {
                        'satellite': {
                            type: 'raster',
                            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                            tileSize: 256
                        },
                        'terrain-source': {
                            type: 'raster-dem',
                            tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
                            encoding: 'terrarium',
                            tileSize: 256
                        }
                    },
                    layers: [{ id: 'satellite-layer', type: 'raster', source: 'satellite' }],
                    terrain: { source: 'terrain-source', exaggeration: 1.5 }
                },
                center: [121.5, 23.5],
                zoom: 7,
                pitch: 45,
                preserveDrawingBuffer: true // 截圖需要
            });

            map.on('load', () => {
                map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
                map.addLayer({
                    id: 'route-line',
                    type: 'line',
                    source: 'route',
                    paint: { 'line-color': '#3b82f6', 'line-width': 5, 'line-opacity': 0.8 }
                });

                map.addSource('point', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: [] } } });
                map.addLayer({
                    id: 'point-circle',
                    type: 'circle',
                    source: 'point',
                    paint: { 'circle-radius': 8, 'circle-color': '#fff', 'circle-stroke-width': 3, 'circle-stroke-color': '#3b82f6' }
                });

                map.addSource('photos', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: [] },
                    cluster: true,
                    clusterMaxZoom: 14,
                    clusterRadius: 50
                });
                map.addLayer({
                    id: 'photo-clusters',
                    type: 'circle',
                    source: 'photos',
                    filter: ['has', 'point_count'],
                    paint: {
                        'circle-color': ['step', ['get', 'point_count'], '#3b82f6', 10, '#f59e0b', 30, '#ef4444'],
                        'circle-radius': ['step', ['get', 'point_count'], 20, 10, 30, 30, 40],
                        'circle-opacity': 0.85,
                        'circle-stroke-width': 2,
                        'circle-stroke-color': '#fff'
                    }
                });
                map.addLayer({
                    id: 'photo-cluster-count',
                    type: 'symbol',
                    source: 'photos',
                    filter: ['has', 'point_count'],
                    layout: {
                        'text-field': '{point_count_abbreviated}',
                        'text-size': 13,
                        'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold']
                    },
                    paint: { 'text-color': '#fff' }
                });
                map.addLayer({
                    id: 'photo-markers',
                    type: 'circle',
                    source: 'photos',
                    filter: ['!', ['has', 'point_count']],
                    paint: {
                        'circle-radius': 10,
                        'circle-color': '#fff',
                        'circle-stroke-width': 3,
                        'circle-stroke-color': '#3b82f6'
                    }
                });

                map.on('click', 'photo-clusters', async (e) => {
                    const features = map.queryRenderedFeatures(e.point, { layers: ['photo-clusters'] });
                    if (!features.length) return;
                    const clusterId = features[0].properties.cluster_id;
                    try {
                        const zoom = await map.getSource('photos').getClusterExpansionZoom(clusterId);
                        map.easeTo({ center: features[0].geometry.coordinates, zoom });
                    } catch (err) { console.warn('Cluster expansion failed:', err); }
                });

                map.on('click', 'photo-markers', (e) => {
                    const props = e.features[0].properties;
                    const coords = e.features[0].geometry.coordinates.slice();
                    if (activePopup) activePopup.remove();
                    activePopup = new maplibregl.Popup({ maxWidth: '220px' })
                        .setLngLat(coords)
                        .setHTML(`
                            <div style="text-align:center">
                                <img src="${props.objectUrl}" style="width:200px;height:150px;object-fit:cover;border-radius:6px;margin-bottom:6px">
                                <div style="font-size:11px;color:#ccc">${escHtml(props.name)}</div>
                                <div style="font-size:11px;color:#9ca3af">${escHtml(props.time) || '時間不明'}</div>
                            </div>
                        `)
                        .addTo(map);
                });

                map.on('mouseenter', 'photo-clusters', () => map.getCanvas().style.cursor = 'pointer');
                map.on('mouseleave', 'photo-clusters', () => map.getCanvas().style.cursor = '');
                map.on('mouseenter', 'photo-markers', () => map.getCanvas().style.cursor = 'pointer');
                map.on('mouseleave', 'photo-markers', () => map.getCanvas().style.cursor = '');
            });
        }

        // 處理照片上傳
        document.getElementById('photo-upload').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const toDec = (dms, ref) => {
                let dec = dms[0] + dms[1] / 60 + dms[2] / 3600;
                return (ref === 'S' || ref === 'W') ? dec * -1 : dec;
            };

            const metadata = await Promise.all(files.map(file => {
                return new Promise(resolve => {
                    EXIF.getData(file, function() {
                        const lat = EXIF.getTag(this, 'GPSLatitude');
                        const lon = EXIF.getTag(this, 'GPSLongitude');
                        const latRef = EXIF.getTag(this, 'GPSLatitudeRef') || 'N';
                        const lonRef = EXIF.getTag(this, 'GPSLongitudeRef') || 'E';
                        const date = EXIF.getTag(this, 'DateTimeOriginal');
                        const formattedDate = date ? date.replace(/^(\d{4}):(\d{2}):(\d{2})/, '$1/$2/$3') : null;
                        resolve({
                            coords: (lat && lon) ? [toDec(lon, lonRef), toDec(lat, latRef)] : null,
                            time: formattedDate,
                            file,
                            name: file.name
                        });
                    });
                });
            }));

            // Release old object URLs to avoid memory leaks
            if (activePopup) { activePopup.remove(); activePopup = null; }
            photoFeatures.forEach(f => URL.revokeObjectURL(f.properties.objectUrl));
            photoFeatures = [];
            noGpsPhotos = [];

            metadata.forEach((m, i) => {
                if (!m.coords) {
                    noGpsPhotos.push({ name: m.name, time: m.time });
                    return;
                }
                photoFeatures.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: m.coords },
                    properties: {
                        id: `photo-${i}`,
                        name: m.name,
                        time: m.time,
                        objectUrl: URL.createObjectURL(m.file)
                    }
                });
            });

            const photosSource = map.getSource('photos');
            if (photosSource) photosSource.setData({ type: 'FeatureCollection', features: photoFeatures });

            // Update no-GPS warning
            let noGpsWarning = document.getElementById('no-gps-warning');
            if (!noGpsWarning) {
                noGpsWarning = document.createElement('p');
                noGpsWarning.id = 'no-gps-warning';
                noGpsWarning.className = 'text-xs text-yellow-400 mt-2';
                document.getElementById('route-subtitle').after(noGpsWarning);
            }
            noGpsWarning.textContent = noGpsPhotos.length > 0
                ? `⚠ ${noGpsPhotos.length} 張無 GPS：${noGpsPhotos.map(p => p.name).join('、')}`
                : '';

            // Sort GPS photos by time (photos without time go last)
            const sortedPoints = photoFeatures
                .map(f => ({ coords: f.geometry.coordinates, time: f.properties.time }))
                .sort((a, b) => {
                    if (!a.time) return 1;
                    if (!b.time) return -1;
                    return new Date(a.time) - new Date(b.time);
                });

            if (sortedPoints.length >= 2) {
                updateRoute(sortedPoints.map(p => p.coords));
            } else {
                routeLine = null;
                const routeSource = map.getSource('route');
                if (routeSource) routeSource.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } });
                const pointSource = map.getSource('point');
                if (pointSource) pointSource.setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [] } });
                if (sortedPoints.length === 1) {
                    document.getElementById('route-subtitle').innerText = '包含 1 個點位（需至少 2 個點才能生成路線）';
                } else {
                    document.getElementById('route-subtitle').innerText = '照片中無足夠 GPS 資訊以生成路線';
                }
            }

            e.target.value = '';
        });

        function updateRoute(coords) {
            routeLine = turf.lineString(coords);
            totalDistance = turf.length(routeLine, { units: 'kilometers' });
            currentDistance = 0;
            isPlaying = false;
            lastTime = 0; // 重置動畫時間戳
            toggleButtons();

            const routeSource = map.getSource('route');
            if (routeSource) routeSource.setData(routeLine);
            const pointSource = map.getSource('point');
            if (pointSource) pointSource.setData({ type: 'Feature', geometry: { type: 'Point', coordinates: [] } });
            const bbox = turf.bbox(routeLine);
            map.fitBounds([[bbox[0], bbox[1]], [bbox[2], bbox[3]]], { padding: 80, duration: 2000 });

            document.getElementById('route-subtitle').innerText = `包含 ${coords.length} 個點位`;
        }

        function getFallbackElevation(point) {
            const fallbackCandidates = [
                point?.properties?.ele,
                point?.properties?.elevation,
                point?.properties?.altitude,
                point?.geometry?.coordinates?.[2]
            ];
            const fallback = fallbackCandidates.find(value => Number.isFinite(Number(value)));
            return fallback !== undefined ? Number(fallback) : null;
        }

        function getPointElevation(point) {
            const coordinates = point?.geometry?.coordinates;
            let terrainElevation = null;

            if (typeof map?.queryTerrainElevation === 'function' && Array.isArray(coordinates)) {
                terrainElevation = map.queryTerrainElevation(coordinates);
            }

            if (Number.isFinite(terrainElevation)) return terrainElevation;
            return getFallbackElevation(point);
        }

        // 動畫循環
        function animate(timestamp) {
            if (!isPlaying) {
                animationId = null;
                return;
            }

            if (!lastTime) lastTime = timestamp;
            const delta = timestamp - lastTime;
            lastTime = timestamp;

            if (routeLine) {
                // 每秒跑 1km (基礎速度)，受倍速控制
                const speed = (1 / 1000) * playbackSpeed; 
                currentDistance += speed * delta;

                if (currentDistance >= totalDistance) {
                    currentDistance = totalDistance;
                    isPlaying = false;
                    toggleButtons();
                }

                const point = turf.along(routeLine, currentDistance, { units: 'kilometers' });
                const nextPoint = turf.along(routeLine, Math.min(currentDistance + 0.05, totalDistance), { units: 'kilometers' });
                const bearing = turf.bearing(point, nextPoint);

                map.getSource('point').setData(point);
                distanceDisplay.innerText = currentDistance.toFixed(2);
                
                const elev = getPointElevation(point);
                elevationDisplay.innerText = Number.isFinite(elev) ? Math.floor(elev) : "---";

                map.jumpTo({
                    center: point.geometry.coordinates,
                    bearing: bearing,
                    pitch: 65,
                    zoom: 15
                });
            }
            animationId = requestAnimationFrame(animate);
        }

        // 播放按鈕
        playBtn.addEventListener('click', () => {
            if (!routeLine) return alert("請先上傳照片生成軌跡");
            if (currentDistance >= totalDistance) currentDistance = 0;
            
            isPlaying = true;
            lastTime = 0; // 關鍵：開始播放時重置 lastTime
            toggleButtons();
            if (!animationId) animationId = requestAnimationFrame(animate);
        });

        pauseBtn.addEventListener('click', () => {
            isPlaying = false;
            toggleButtons();
        });

        function toggleButtons() {
            playBtn.classList.toggle('hidden', isPlaying);
            pauseBtn.classList.toggle('hidden', !isPlaying);
        }

        // 倍速切換
        document.getElementById('speed-btn').addEventListener('click', function() {
            const speeds = [1.0, 2.0, 4.0, 8.0];
            let idx = speeds.indexOf(playbackSpeed);
            playbackSpeed = speeds[(idx + 1) % speeds.length];
            this.innerText = playbackSpeed.toFixed(1) + 'x';
        });

        // 視角切換
        document.getElementById('view-toggle-btn').addEventListener('click', () => {
            const currentPitch = map.getPitch();
            map.easeTo({ pitch: currentPitch > 30 ? 0 : 65, duration: 1000 });
        });

        // 標題防換行修正
        routeTitle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                routeTitle.blur();
            }
        });

        // 截圖下載
        document.getElementById('share-btn').addEventListener('click', () => {
            const dataUrl = map.getCanvas().toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'hiking-3d-route.png';
            link.href = dataUrl;
            link.click();
        });
    </script>
</body>
</html>
